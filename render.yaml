services:
  - type: web
    name: pola
    runtime: ruby
    plan: free
    buildCommand: bundle install && rails db:migrate && rails assets:precompile
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pola-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MAX_THREADS
        value: 5

databases:
  - name: pola-db
    databaseName: pola_production
    user: pola
    plan: free
